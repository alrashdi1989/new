name: Snap Check
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/snap-check.yml'
      - 'snaptest.py'
# rev: 2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet requests
      - run: python snaptest.py
