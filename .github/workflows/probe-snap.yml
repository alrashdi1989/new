name: probe-snap
on:
  workflow_dispatch:
    inputs:
      user:
        description: Snapchat username
        required: true
        default: balhaf123

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install gallery-dl requests
      - name: Run the real extractor end to end
        env:
          USER: ${{ github.event.inputs.user }}
        run: |
          python3 - <<'PY'
          import os
          from gallery_dl import config, extractor
          from gallery_dl.extractor.common import Message
          import snapext
          snapext.register()
          config.set(("extractor", "snapchat"), "sections", "Story,Spotlight")
          ex = extractor.find("snapfull:" + os.environ["USER"])
          ex.initialize()
          urls, dirs = [], []
          for msg in ex:
              if not msg:
                  continue
              if msg[0] == Message.Url:
                  urls.append(msg)
              elif msg[0] == Message.Directory:
                  dirs.append(msg)
          print("DIRECTORIES", [d[-1].get("section") for d in dirs])
          print("URL_MESSAGES", len(urls))
          for m in urls[:4]:
              d = m[2]
              print("  URL", d.get("section"), d.get("extension"), "date:", d.get("date"),
                    "id:", d.get("id"), m[1][:70])
          PY
