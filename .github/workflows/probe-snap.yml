name: probe-snap
on:
  workflow_dispatch:
    inputs:
      user:
        description: Snapchat username
        required: true
        default: balhaf123

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - run: pip install requests
      - name: Inspect the RSC flight data
        env:
          USER: ${{ github.event.inputs.user }}
        run: |
          python3 - <<'PY'
          import os, re, json
          import requests
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36")
          user = os.environ["USER"]
          r = requests.get(f"https://www.snapchat.com/add/{user}",
                           headers={"User-Agent": UA, "Accept-Language": "en-US,en"}, timeout=30)
          html = r.text
          chunks = re.findall(r'self\.__next_f\.push\(\[1,\s*"((?:[^"\\]|\\.)*)"\]\)', html)
          print("CHUNKS", len(chunks))
          flight = ""
          for c in chunks:
              try:
                  flight += json.loads('"' + c + '"')
              except Exception:
                  pass
          print("FLIGHT_LEN", len(flight))
          # media URLs
          media = sorted(set(re.findall(r'https://[a-z0-9.-]*sc-cdn\.net/[^\s"\\]+', flight)))
          print("MEDIA_URLS", len(media))
          for u in media[:6]:
              print("  U", u[:120])
          # key discovery: what fields sit near a media url / story
          for key in ['"story"', '"highlight"', '"spotlight"', "snapId", "snapMediaType",
                      "mediaType", "timestampInSec", "timestamp", "snapUrls", "mediaUrl",
                      "mediaPreviewUrl", "snapList", "storyId", "title"]:
              print("KEY", key, flight.count(key))
          i = flight.find('"story"')
          if i != -1:
              print("AROUND_STORY", flight[i-40:i+600])
          m = re.search(r'sc-cdn\.net/', flight)
          if m:
              j = m.start()
              print("AROUND_MEDIA", flight[j-200:j+150])
          PY
