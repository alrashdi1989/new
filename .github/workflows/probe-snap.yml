name: probe-snap
on:
  workflow_dispatch:
    inputs:
      user:
        required: true
        default: balhaf123
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - env:
          USER: ${{ github.event.inputs.user }}
        run: |
          python3 - <<'PY'
          import os, avatars, requests
          url = avatars._snapchat_avatar(os.environ["USER"])
          print("AVATAR_URL", (url or "NONE")[:100])
          if url:
              h = requests.get(url, headers={"User-Agent": avatars.UA}, timeout=30)
              print("DOWNLOAD status", h.status_code, "type", h.headers.get("content-type"),
                    "bytes", len(h.content))
          PY
