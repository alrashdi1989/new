name: probe-snap
on:
  workflow_dispatch:
    inputs:
      user:
        description: Snapchat username
        required: true
        default: balhaf123

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install gallery-dl requests
      - name: Run the real extractor end to end
        env:
          USER: ${{ github.event.inputs.user }}
        run: |
          python3 - <<'PY'
          import os
          from gallery_dl import config, job
          from gallery_dl.extractor.common import Message
          import snapext
          snapext.register()
          config.set(("extractor", "snapchat"), "sections", "Story,Spotlight")
          j = job.DataJob("snapfull:" + os.environ["USER"], file=open(os.devnull, "w"))
          j.run()
          urls = [m for m in j.data if m[0] == Message.Url]
          dirs = [m for m in j.data if m[0] == Message.Directory]
          print("DIRECTORIES", [d[2].get("section") for d in dirs])
          print("URL_MESSAGES", len(urls))
          for m in urls[:4]:
              d = m[2]
              print("  URL", d.get("section"), d.get("extension"), "date:", d.get("date"),
                    "id:", d.get("id"), m[1][:70])
          PY
