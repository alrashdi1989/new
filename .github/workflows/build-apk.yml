name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write        # needed to publish the APK as a Release

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Use the app's permanent signing key (so updates install over the old version)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        run: yes | buildozer -v android debug

      - name: Sign with the app's permanent key (so updates install over the old version)
        run: |
          BT=$(dirname "$(find ~/.buildozer -name apksigner -type f | sort | tail -1)")
          APK=$(ls bin/*.apk | head -1)
          mkdir -p out
          "$BT/zipalign" -f -p 4 "$APK" out/aligned.apk
          "$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android \
            --out "out/MediaDownloader.apk" out/aligned.apk
          rm out/aligned.apk
          "$BT/apksigner" verify --print-certs out/MediaDownloader.apk | grep -i "SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: x-media-downloader-apk
          path: out/MediaDownloader.apk

      - name: Read app version
        id: ver
        run: echo "v=$(grep -m1 '^version' buildozer.spec | sed 's/.*= *//')" >> "$GITHUB_OUTPUT"

      - name: Publish APK as a Release (public, no login needed)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Media Downloader v${{ steps.ver.outputs.v }}
          files: out/MediaDownloader.apk
          make_latest: true
          body: |
            Media Downloader v${{ steps.ver.outputs.v }}

            Download **MediaDownloader.apk** below and install it (no GitHub login needed).
            The latest version is always at:
            https://github.com/alrashdi1989/new/releases/latest/download/MediaDownloader.apk
