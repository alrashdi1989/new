name: Probe Firebase
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-fb2.yml'
# rev: 2

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Identify key's project and test Firestore
        run: |
          set +e
          KEY="AIzaSyDglLSKXJe5iqJ2VKmVhYSJl0HOvtRb-MU"

          echo "===== 1. SIGN UP + decode token to find the key's real project ====="
          SU=$(curl -s -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$KEY" -H "Content-Type: application/json" --data '{"email":"ci-probe-'"$RANDOM"'@example.com","password":"probe123456","returnSecureToken":true}')
          TOKEN=$(echo "$SU" | python3 -c "import sys,json;print(json.load(sys.stdin).get('idToken',''))")
          MYUID=$(echo "$SU" | python3 -c "import sys,json;print(json.load(sys.stdin).get('localId',''))")
          PROJ=$(python3 -c "import sys,json,base64; t=sys.argv[1].split('.')[1]; t+='='*(-len(t)%4); print(json.loads(base64.urlsafe_b64decode(t)).get('aud',''))" "$TOKEN")
          echo "key_belongs_to_project = [$PROJ]"

          echo "===== 2. Test Firestore read/write against that project ====="
          FS="https://firestore.googleapis.com/v1/projects/$PROJ/databases/(default)/documents"
          echo "--- write (PATCH) ---"
          curl -s -w "\nHTTP:%{http_code}\n" -X PATCH "$FS/users/$MYUID" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data '{"fields":{"data":{"stringValue":"{\"ping\":1}"},"updated":{"integerValue":"1"}}}'
          echo "--- read (GET) ---"
          curl -s -w "\nHTTP:%{http_code}\n" "$FS/users/$MYUID" -H "Authorization: Bearer $TOKEN"

          echo "===== 3. Clean up ====="
          curl -s -o /dev/null -w "doc_delete HTTP:%{http_code}\n" -X DELETE "$FS/users/$MYUID" -H "Authorization: Bearer $TOKEN"
          curl -s -o /dev/null -w "acct_delete HTTP:%{http_code}\n" -X POST "https://identitytoolkit.googleapis.com/v1/accounts:delete?key=$KEY" -H "Content-Type: application/json" --data '{"idToken":"'"$TOKEN"'"}'
          echo "===== done ====="
